<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<title>Fasttracker II clone</title>
	<style>
		:root, html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}

		body {
			display: grid;
			place-items: center;
		}

		canvas {
			display: block;
			width: min(100vw, 158vh);
			height: min(100vh, 63.29114vw);
			background: #000;
			image-rendering: pixelated;
			outline: none;
		}

		#status {
			position: fixed;
			inset: auto 0 1rem;
			padding: 0.4rem;
			color: #fff;
			font: 14px sans-serif;
			text-align: center;
			pointer-events: none;
		}

		#file-input {
			display: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
	<div id="status">Loading Fasttracker II clone...</div>
	<input id="file-input" type="file" accept=".xi,.iff,.raw,.wav,.snd,.smp,.sam,.aif,.pat,.aiff,.flac,.ogg,.mp3,.brr">
	<script>
		var statusElement = document.getElementById("status");
		var fileInput = document.getElementById("file-input");
		var Module = {
			canvas: document.getElementById("canvas"),
			openFilePicker: function () {
				fileInput.click();
			},
			setStatus: function (status) {
				statusElement.textContent = status;
				statusElement.hidden = status.length === 0;
			},
			notify: function (status) {
				if (this.statusTimeout !== null)
					clearTimeout(this.statusTimeout);
				this.setStatus(status);
				this.statusTimeout = setTimeout(() => this.setStatus(""), 6000);
			},
			statusTimeout: null,
			webLibraryRequestId: 0,
			webLibraryRoot: null,
			webLibraryPath: [],
			webModuleExtensions: null,
			webModuleLoading: false,
			onRuntimeInitialized: function () {
				const extensions = [];
				for (let i = 0; ; i++) {
					const extension = this.ccall("webModuleExtension", "string", ["number"], [i]);
					if (extension === "END_OF_LIST")
						break;
					extensions.push(extension);
				}
				this.webModuleExtensions = new Set(extensions);
				fileInput.accept += "," + extensions.map(extension => "." + extension).join(",");
				this.notify("Drop a file or press Ctrl+O to open it. Ctrl+D opens Disk Op.");
				if (navigator.platform.toLowerCase().includes("mac"))
					this.notify("Drop a file or press Cmd+O to open it. Cmd+D opens Disk Op.");
				this.canvas.focus();
			},
			loadWebLibrary: async function () {
				const requestId = ++this.webLibraryRequestId;
				try {
					const response = await fetch(new URL("mods/index.json", document.baseURI), { cache: "no-cache" });
					if (!response.ok)
						throw new Error("Module index request failed: " + response.status);

					const index = await response.json();
					if (!index || !Array.isArray(index.files))
						throw new Error("Module index has an invalid format");

					const root = { directories: new Map(), files: [] };
					for (const entry of index.files) {
						const pathParts = entry && typeof entry.name === "string" ? entry.name.split("/") : [];
						const filename = pathParts[pathParts.length - 1] || "";
						const extensionOffset = filename.lastIndexOf(".");
						const extension = filename.slice(extensionOffset + 1);
						if (!entry || typeof entry.name !== "string" ||
							pathParts.some(part => !part || part === "." || part === ".." || /[\\\u0000-\u001f\u007f]/.test(part)) ||
							extensionOffset <= 0 || !/^[a-z0-9]+$/i.test(extension) ||
							!this.webModuleExtensions.has(extension.toLowerCase()) ||
							!Number.isSafeInteger(entry.size) || entry.size < 0)
						{
							throw new Error("Module index contains an invalid entry");
						}

						let directory = root;
						for (const part of pathParts.slice(0, -1)) {
							if (!directory.directories.has(part))
								directory.directories.set(part, { directories: new Map(), files: [] });
							directory = directory.directories.get(part);
						}
						directory.files.push({ name: pathParts[pathParts.length - 1], size: entry.size });
					}

					if (requestId !== this.webLibraryRequestId)
						return;

					this.webLibraryRoot = root;
					if (!this.getWebLibraryDirectory())
						this.webLibraryPath = [];
					this.showWebLibraryDirectory();
					if (index.files.length === 0)
						this.notify("The web module library is empty.");
				} catch (error) {
					if (requestId !== this.webLibraryRequestId)
						return;
					this.webLibraryRoot = null;
					console.error("Could not load the web module library:", error);
					this.ccall("webDiskOpBeginLibrary", "number", [], []);
					this.ccall("webDiskOpFinishLibrary", null, [], []);
					this.notify("Could not load the web module library: " + (error.message || error));
				}
			},
			getWebLibraryDirectory: function () {
				let directory = this.webLibraryRoot;
				for (const part of this.webLibraryPath) {
					if (!directory)
						return null;
					directory = directory.directories.get(part);
				}
				return directory;
			},
			showWebLibraryDirectory: function () {
				const directory = this.getWebLibraryDirectory();
				if (!directory)
					throw new Error("Module library directory does not exist");

				this.ccall("webDiskOpBeginLibrary", "number", [], []);
				this.ccall("webDiskOpSetLibraryPath", null, ["string"], [this.webLibraryPath.join("/")]);
				const addEntry = (name, size, isDir) => {
					if (!this.ccall("webDiskOpAddLibraryEntry", "number", ["string", "number", "number"], [name, size, isDir]))
						throw new Error("Could not add entry to Disk Op. list: " + name);
				};
				if (this.webLibraryPath.length)
					addEntry("..", 0, 1);
				for (const name of [...directory.directories.keys()].sort((a, b) => a.localeCompare(b)))
					addEntry(name, 0, 1);
				for (const entry of directory.files.sort((a, b) => a.name.localeCompare(b.name)))
					addEntry(entry.name, entry.size, 0);
				this.ccall("webDiskOpFinishLibrary", null, [], []);
			},
			navigateWebLibrary: function (name) {
				if (!this.webLibraryRoot)
					return;
				try {
					const directory = this.getWebLibraryDirectory();
					if (name === "/")
						this.webLibraryPath = [];
					else if (name === "..")
						this.webLibraryPath.pop();
					else if (directory && directory.directories.has(name))
						this.webLibraryPath.push(name);
					else
						throw new Error("Module library directory does not exist: " + name);
					this.showWebLibraryDirectory();
				} catch (error) {
					console.error("Could not open the web library directory:", error);
					this.ccall("webDiskOpBeginLibrary", "number", [], []);
					this.ccall("webDiskOpFinishLibrary", null, [], []);
					this.notify("Could not open the web library directory: " + (error.message || error));
				}
			},
			loadWebModule: async function (name) {
				if (this.webModuleLoading)
					return;

				this.webModuleLoading = true;
				let path;
				let fileWritten = false;
				try {
					const pathParts = [...this.webLibraryPath, name];
					this.notify("Loading " + name + "...");
					if (pathParts.some(part => !part || part === "." || part === ".." || /[\/\\\u0000-\u001f\u007f]/.test(part)))
						throw new Error("Invalid module path");

					const encodedPath = pathParts.map(encodeURIComponent).join("/");
					const response = await fetch(new URL("mods/" + encodedPath, document.baseURI));
					if (!response.ok)
						throw new Error("Module request failed: " + response.status);

					const contents = new Uint8Array(await response.arrayBuffer());
					this.FS.mkdirTree("/web-library/" + pathParts.slice(0, -1).join("/"));
					path = "/web-library/" + pathParts.join("/");
					this.FS.writeFile(path, contents);
					fileWritten = true;
					const moduleLoaded = this.ccall("webLoadDroppedFile", "number", ["string"], [path]);
					if (moduleLoaded)
						updateDocumentTitle(pathParts[pathParts.length - 1]);
					else
						this.notify("Could not load " + name);
				} catch (error) {
					console.error("Could not open a module from the web library:", error);
					this.notify("Could not open " + name);
				} finally {
					try {
						if (fileWritten)
							this.FS.unlink(path);
					} finally {
						this.webModuleLoading = false;
					}
				}
			},
			printErr: function (text) {
				console.error(text);
			}
		};

		function updateDocumentTitle(fileName) {
			const titlePrefix = document.title.split(" - ")[0];
			document.title = titlePrefix + " - \"" + fileName + "\"";
		}

		async function loadBrowserFile(file) {
			if (!file) return;
			try {
				const path = "/" + file.name;
				const contents = new Uint8Array(await file.arrayBuffer());
				Module.FS.writeFile(path, contents);
				const moduleLoaded = Module.ccall("webLoadDroppedFile", "number", ["string"], [path]);
				if (moduleLoaded)
					updateDocumentTitle(file.name);
			} catch (error) {
				console.error("Could not open the selected file:", error);
				Module.notify("Could not open " + file.name);
			}
		}

		fileInput.addEventListener("change", function () {
			loadBrowserFile(fileInput.files[0]);
			fileInput.value = "";
		});

		document.addEventListener("keydown", function (event) {
			if (event.repeat || !(event.ctrlKey || event.metaKey))
				return;

			if (event.key.toLowerCase() === "o") {
				event.preventDefault();
				Module.openFilePicker();
			}
			else if (event.key.toLowerCase() === "d") {
				event.preventDefault();
				Module.openFilePicker();
			}
		});

		document.addEventListener("dragover", function (event) {
			if (event.dataTransfer.types.includes("Files"))
				event.preventDefault();
		});

		document.addEventListener("drop", function (event) {
			const files = event.dataTransfer.files;
			if (files.length > 0) {
				event.preventDefault();
				event.stopPropagation();
				loadBrowserFile(files[0]);
			}
		});
	</script>
	{{{ SCRIPT }}}
</body>
</html>
